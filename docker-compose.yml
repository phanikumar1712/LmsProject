services:

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend
    # Backend is NOT exposed to host directly in production.
    # Nginx proxies /api/* → lms-backend:5000 inside the Docker network.
    # Uncomment the line below only for local debugging:
    # ports:
    #   - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      # In production nginx proxies to backend, so FRONTEND_URL is the public origin
      # (set to http://<server-ip> when no domain is configured)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
    networks:
      - lms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Frontend (Production Build served by Nginx) ──────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # /api is proxied through nginx to the backend container — no CORS issues
        VITE_API_URL: /api
    container_name: lms-frontend
    ports:
      - "80:80"
    networks:
      - lms-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend Dev (Hot Reload – run with: docker compose --profile dev up) ─────
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lms-frontend-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - lms-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - dev

networks:
  lms-network:
    driver: bridge
