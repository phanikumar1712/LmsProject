# LMS site — serves the built React frontend and proxies /api to the Node backend.
# Install to /etc/nginx/sites-available/lms and symlink into /etc/nginx/sites-enabled.
# When you later add a domain, replace `server_name _;` with your domain and add a
# 443/TLS server block (e.g. via certbot).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/lms/frontend/dist;
    index index.html;

    # ── Gzip compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # ── Proxy /api requests to the backend ──────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ── Static assets (long-lived cache) ────────────────────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────────
    location / {
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}